# =============================================================================
# Claude review. Chạy plugin code-review của Anthropic (chính là /code-review dùng ở máy local) khi
# một pull request được mở hoặc rời trạng thái draft, rồi đăng kết quả thành comment trên PR.
#
# Plugin đọc mọi CLAUDE.md trên các đường dẫn bị sửa, chạy song song nhiều agent review (tuân thủ
# CLAUDE.md, bug trong diff, lịch sử git) và chỉ đăng những phát hiện vượt qua ngưỡng tin cậy. Nó bỏ
# qua PR đã đóng, draft, PR quá nhỏ và PR Claude đã review rồi - vì vậy KHÔNG có trigger synchronize:
# chạy lần hai trên cùng PR cũng sẽ dừng ở bước kiểm tra đó, sau khi đã tiêu quota để biết điều ấy.
#
# Mỗi lần chạy tiêu quota subscription của người sở hữu CLAUDE_CODE_OAUTH_TOKEN, và plugin dùng nhiều
# agent nên không rẻ. Muốn review commit mới hơn thì comment "@claude review" (claude.yml).
#
# Chỉ mang tính tham khảo. Không phải required check - cổng chặn merge là ci.yml (pnpm validate).
# =============================================================================

name: claude-review

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      # Action đổi OIDC token lấy installation token của Claude GitHub App - token đó mới là thứ
      # thực sự ghi comment.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Agent lịch sử của plugin chạy git blame trên các dòng bị sửa.
          fetch-depth: 0

      # Pin theo commit: tag có thể bị dời sang code khác, mà bước này giữ token.
      # Bump cả hai workflow cùng lúc, trên cả develop và main, nếu không mọi lần chạy đều fail validation.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
          # Command đã khai báo các tool này trong frontmatter; liệt kê lại ở đây để phiên headless
          # không dừng ở một permission prompt không ai trả lời được.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*)"
