# =============================================================================
# @claude theo yêu cầu. Nhắc @claude trong comment của PR hoặc issue, review comment, hoặc issue mới,
# Claude sẽ trả lời ngay tại đó - một câu hỏi, review lại ("@claude review"), hoặc một thay đổi code.
#
# Action tự từ chối người không có quyền write trên repo, nên comment từ bên ngoài không tiêu được token.
#
# Khác BE: repo này có hook trong .claude/settings.json chạy cả trong CI - sửa file thì
# format-changed-file gọi prettier, kết thúc lượt thì remind-validate bắt chạy `pnpm run validate`.
# Vì vậy phải cài node_modules trước, nếu không mọi lần @claude sửa code đều vấp hook.
# =============================================================================

name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      # Cho Claude đọc kết quả CI trên PR khi được hỏi vì sao build fail.
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Phiên bản pnpm lấy từ "packageManager" trong package.json - không khai báo lại ở đây.
      # Action bên thứ ba nên pin theo commit (v6.1.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Pin theo commit: tag có thể bị dời sang code khác, mà bước này giữ token.
      # Bump cả hai workflow cùng lúc, trên cả develop và main, nếu không mọi lần chạy đều fail validation.
      - uses: anthropics/claude-code-action@5eb090f3c3afd701a0672cd32981197ca27688f6 # v1.0.253
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
