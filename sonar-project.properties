# SonarQube Cloud. The organization is not set here: .github/workflows/sonar.yml passes it from the
# SONAR_ORGANIZATION repository variable.
sonar.projectKey=KLTN-FA26_fe-backoffice-stockflow-commerce
sonar.projectName=fe-backoffice-stockflow-commerce
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/__tests__/**,src/test/**

# Not analysed at all: test fixtures, mocks, generated or non-code files.
sonar.exclusions=**/__fixtures__/**,**/__mocks__/**,**/mock/**,**/mocks/**,**/mock-fixtures/**,src/_design/**,**/*.d.ts,**/*.gen.ts,**/*.generated.*

# Analysed, but not expected to carry coverage: shadcn/ui primitives (generated into the repo) and
# the routing glue of the App Router.
sonar.coverage.exclusions=src/components/ui/**,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/not-found.tsx

# Written by `pnpm run test:coverage` (vitest, v8 provider).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
